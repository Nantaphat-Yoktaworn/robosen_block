<script type="text/html" data-help-name="robosen-end">
  <p><b>Robosen End Block (Passive Loopback Terminator)</b></p>
  <p>Simulates the passive physical termination module that bridges the downstream serial transmit line (Pin 3) directly to the return rail (Pin 4).</p>

  <h3>How it Works:</h3>
  <ul>
    <li>Receives the final mutated string (e.g. <code>"start,move_forward,turn_left,left_punch"</code>).</li>
    <li>Loops the string back into the return rail output.</li>
    <li>Connect this output back into the <b>Return RX</b> input of the <b>Master Block</b> to complete the circuit.</li>
  </ul>
</script>
