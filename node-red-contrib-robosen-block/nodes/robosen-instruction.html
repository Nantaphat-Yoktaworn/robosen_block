<script type="text/javascript">
  RED.nodes.registerType("robosen-instruction", {
    category: "Robosen Block",
    color: "#0288D1",
    defaults: {
      name: { value: "" },
      command: { value: "move_forward", required: true },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-cube",
    paletteLabel: "instruction block",
    label: function () {
      if (this.name) return this.name;
      const map = {
        move_forward: "Move Forward",
        move_backward: "Move Backward",
        turn_left: "Turn Left",
        turn_right: "Turn Right",
        left_punch: "Left Punch",
        right_punch: "Right Punch",
        kung_fu: "Kung Fu",
        boogaloo: "Boogaloo Dance",
        single_kick: "Single Kick",
        push_ups: "Push-ups",
        handstand: "Handstand",
        head_left: "Head Left",
        head_right: "Head Right",
        head_center: "Head Center",
        head_pan: "Head Pan",
        wait_delay: "Delay 2s",
      };
      return map[this.command] || this.command;
    },
    labelStyle: function () {
      return this.name ? "node_label_italic" : "";
    },
    inputLabels: ["Pin In (Upstream TX)"],
    outputLabels: ["Pin Out (Downstream TX)"],
  });
</script>

<script type="text/html" data-template-name="robosen-instruction">
  <div class="form-row">
    <label for="node-input-command"><i class="fa fa-cogs"></i> Command</label>
    <select id="node-input-command">
      <optgroup label="Locomotion">
        <option value="move_forward">Walk Forward</option>
        <option value="move_backward">Walk Backward</option>
        <option value="turn_left">Turn Left</option>
        <option value="turn_right">Turn Right</option>
      </optgroup>
      <optgroup label="Combat & Martial Arts">
        <option value="left_punch">Left Punch</option>
        <option value="right_punch">Right Punch</option>
        <option value="kung_fu">Kung Fu</option>
      </optgroup>
      <optgroup label="Stunts & Entertainment">
        <option value="boogaloo">Boogaloo Dance</option>
        <option value="single_kick">Single Leg Kick</option>
        <option value="push_ups">Push-ups</option>
        <option value="handstand">Handstand</option>
      </optgroup>
      <optgroup label="Head & Joint Kinematics">
        <option value="head_left">Head Turn Left</option>
        <option value="head_right">Head Turn Right</option>
        <option value="head_center">Head Center (Neutral)</option>
        <option value="head_pan">Head Pan (Left-Right-Center Sweep)</option>
      </optgroup>
      <optgroup label="Control Flow">
        <option value="wait_delay">Wait / Pause (2 Seconds)</option>
      </optgroup>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Custom Label</label>
    <input type="text" id="node-input-name" placeholder="Optional custom name" />
  </div>
</script>

<script type="text/html" data-help-name="robosen-instruction">
  <p><b>Robosen Instruction Block (Command Module)</b></p>
  <p>Represents one physical modular instruction block in the tangible coding chain.</p>

  <h3>How it Works:</h3>
  <ul>
    <li>Receives the upstream string on <b>Pin In</b> (e.g. <code>"start,move_forward"</code>).</li>
    <li>Appends its own command identifier token (e.g. <code>",turn_left"</code>).</li>
    <li>Passes the mutated string downstream via <b>Pin Out</b> (<code>"start,move_forward,turn_left"</code>).</li>
  </ul>
</script>
